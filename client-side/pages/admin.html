<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Logger - Admin Panel</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

    <div id="header2">
        <h2>Admin Panel</h2>
        <button class="header-logout" onclick="logout()" style="background-color:  #c9302c;">Log out</button>
    </div>

    <div class="wide-box">
        <h1>User Management</h1>
        <div class="subtitle">
            Welcome, Admin. Here are the registered users.
        </div>
    
        <section class="card">
            <h3>All Users</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Created At</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr><td colspan="5">Loading...</td></tr>
                </tbody>
            </table>
        </section>
    </div>

    <script src="../scripts/axios.min.js"></script>
    <script src="../scripts/admin.js"></script>
</body>
</html>
